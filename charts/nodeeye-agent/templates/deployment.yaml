apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodeeye-agent.fullname" . }}
  labels:
    {{- include "nodeeye-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nodeeye-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nodeeye-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nodeeye-agent.serviceAccountName" . }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.runtimeSecurity.enabled }}
      hostPID: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if .Values.runtimeSecurity.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --control-plane={{ .Values.controlPlaneUrl }}
            - --heartbeat={{ .Values.agent.heartbeatInterval }}
            - --snapshot={{ .Values.agent.snapshotInterval }}
            {{- if .Values.agent.debug }}
            - --debug
            {{- end }}
          env:
            - name: NODEEYE_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nodeeye-agent.fullname" . }}
                  key: agent-token
            {{- if .Values.clusterId }}
            - name: NODEEYE_CLUSTER_ID
              value: {{ .Values.clusterId | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.runtimeSecurity.enabled }}
            - name: NODEEYE_RUNTIME_SECURITY
              value: "true"
            - name: NODEEYE_RUNTIME_SCAN_INTERVAL
              value: {{ .Values.runtimeSecurity.scanInterval | default 5 | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.extraVolumeMounts .Values.runtimeSecurity.enabled }}
          volumeMounts:
            {{- if .Values.runtimeSecurity.enabled }}
            - name: proc
              mountPath: /proc
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.extraVolumes .Values.runtimeSecurity.enabled }}
      volumes:
        {{- if .Values.runtimeSecurity.enabled }}
        - name: proc
          hostPath:
            path: /proc
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
